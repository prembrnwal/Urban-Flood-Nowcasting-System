spring:
  application:
    name: urban-flood-nowcasting
  datasource:
    url: jdbc:h2:mem:floodnowcast;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: Urban Flood Nowcasting API
    version: 1.0.0
    description: "SIH Prototype - DEMO/SIMULATED DATA"

logging:
  level:
    com.floodnowcast: INFO
    org.hibernate.SQL: WARN
